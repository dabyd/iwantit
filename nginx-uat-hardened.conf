map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

# =============================================================================
# PRERREQUISITOS (ejecutar en el servidor antes de aplicar esta config):
#   sudo apt install -y apache2-utils nginx-extras
#   sudo htpasswd -c /etc/nginx/.htpasswd-uat uat-viewer
#   sudo chown root:www-data /etc/nginx/.htpasswd-uat
#   sudo chmod 640 /etc/nginx/.htpasswd-uat
# =============================================================================

server {
    listen 443 ssl http2;
    server_name uat.i-want-it.es;

    # =========================================================================
    # SSL — Certificados y hardening
    # =========================================================================
    ssl_certificate /etc/letsencrypt/live/uat.i-want-it.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.i-want-it.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # SSL hardening adicional (sobrescribe/añade sobre options-ssl-nginx.conf)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # =========================================================================
    # Ocultar versión de Nginx
    # =========================================================================
    server_tokens off;
    # Requiere nginx-extras instalado:
    more_clear_headers 'Server';

    # =========================================================================
    # Cabeceras de seguridad HTTP (defensa en profundidad)
    # =========================================================================
    # NOTA sobre add_header en Nginx: las directivas add_header en un bloque
    # location HIJO reemplazan TODAS las add_header del padre. Las locations
    # /players/, /bbm/, /test/ y /uploads/ usan add_header para Cache-Control,
    # por lo que ahí se repiten las cabeceras de seguridad abajo manualmente.
    # more_set_headers (nginx-extras) NO tiene este problema; si se prefiere,
    # sustituir todos los add_header de seguridad por more_set_headers.

    # HSTS: 1 semana en UAT (suficiente sin riesgo de bloqueo prolongado)
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;

    # Protección contra clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Evitar MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Control de referrer
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Políticas cross-domain
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Aislamiento cross-origin
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Restringir APIs del navegador no usadas
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content-Security-Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Bloquear indexación de TODO el subdominio UAT
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # =========================================================================
    # HTTP Basic Auth — barrera previa para todo el sitio
    # =========================================================================
    auth_basic "UAT - Acceso Restringido";
    auth_basic_user_file /etc/nginx/.htpasswd-uat;

    # =========================================================================
    # Gzip — (se mantiene igual)
    # =========================================================================
    gzip on;
    gzip_types text/css text/javascript text/xml text/plain application/javascript application/json application/xml font/truetype font/woff2 image/svg+xml;

    # =========================================================================
    # Rate limiting
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # =========================================================================
    # NUEVA RUTA ROOT
    # =========================================================================
    root /var/www2/iwantit/current/public;
    index index.php index.html;

    client_max_body_size 5G;

    # =========================================================================
    # Bloqueo de archivos sensibles (regex — evaluadas en orden)
    # =========================================================================

    # Archivos ocultos (excepto .well-known para Let's Encrypt)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Backups, configuraciones y logs
    location ~* \.(bak|sql|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Archivos de Composer
    location ~* composer\.(json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Archivos de build (Node/Vite/Webpack)
    location ~* (package\.json|package-lock\.json|webpack\.config\.js|vite\.config\.js)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # =========================================================================
    # Bloqueo de archivos sensibles — reglas existentes (se mantienen)
    # =========================================================================
    location ~ /\.(env|htaccess|git) { deny all; }
    location ~ ^/(storage|bootstrap/cache)/ { deny all; }

    # =========================================================================
    # Login — rate limiting específico contra fuerza bruta
    # =========================================================================
    location /login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =========================================================================
    # PLAYERS (Nueva ubicación)
    # =========================================================================
    location = /players {
        return 301 $scheme://$http_host/players/;
    }

    location ^~ /players/ {
        alias /var/www2/iwantit/current/players/;
        index index.html;
        try_files $uri $uri/ /players/index.html;

        # Cabeceras de seguridad repetidas (ver NOTA arriba sobre add_header)
        add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # BBM
    # =========================================================================
    location ^~ /bbm/ {
        alias /var/www2/iwantit/current/bbm/;
        index index.html;
        try_files $uri $uri/ /bbm/index.html;

        # Cabeceras de seguridad repetidas
        add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # TEST
    # =========================================================================
    location = /test {
        return 301 $scheme://$http_host/test/;
    }

    location ^~ /test/ {
        alias /var/www2/iwantit/current/test/;
        index index.html;
        try_files $uri $uri/ /test/index.html;

        # Cabeceras de seguridad repetidas
        add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # UPLOADS — Persistencia (ruta antigua, respetada para compatibilidad)
    # =========================================================================
    location /uploads/ {
        alias /var/www/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Cabeceras de seguridad repetidas
        add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        log_not_found off;

        # Bloquear ejecución de scripts dentro de uploads
        location ~* /uploads/.*\.(php|pl|py|cgi|asp|jsp)$ {
            deny all;
        }
    }

    # =========================================================================
    # Laravel — ruta principal
    # =========================================================================
    location / {
        limit_req zone=general burst=10 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # =========================================================================
    # PHP Handling (PHP 8.4)
    # =========================================================================
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param PHP_VALUE "upload_max_filesize=5G \n post_max_size=5G \n memory_limit = 5G \n max_execution_time = 500";
        fastcgi_read_timeout 600;

        # Prevenir path-info attacks
        fastcgi_param PATH_TRANSLATED "";
    }
}

# =============================================================================
# Redirección HTTP → HTTPS (se mantienen ambos dominios)
# =============================================================================
server {
    listen 80;
    server_name uat.i-want-it.es demo.i-want-it.es;

    # Let's Encrypt ACME challenge — sin autenticación ni redirección
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www2/iwantit/current/public;
        default_type "text/plain";
        try_files $uri =404;
    }

    # El resto se redirige a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
