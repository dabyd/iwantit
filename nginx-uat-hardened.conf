map $http_accept $webp_suffix {
    default "";
    "~*webp" ".webp";
}

# =============================================================================
# PRERREQUISITOS:
#   sudo apt install -y nginx-extras
#   (rate-limit.conf ya está en /etc/nginx/conf.d/)
# =============================================================================

server {
    listen 443 ssl http2;
    server_name uat.i-want-it.es;

    # =========================================================================
    # SSL
    # =========================================================================
    ssl_certificate /etc/letsencrypt/live/uat.i-want-it.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uat.i-want-it.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # =========================================================================
    # Ocultar versión de Nginx
    # =========================================================================
    server_tokens off;
    more_clear_headers 'Server';

    # =========================================================================
    # Cabeceras de seguridad HTTP
    # =========================================================================
    add_header Strict-Transport-Security "max-age=604800; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net cdnjs.cloudflare.com kit.fontawesome.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com; img-src 'self' data: blob:; font-src 'self' cdnjs.cloudflare.com kit.fontawesome.com ka-f.fontawesome.com; connect-src 'self' ka-f.fontawesome.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # =========================================================================
    # Gzip
    # =========================================================================
    gzip on;
    gzip_types text/css text/javascript text/xml text/plain application/javascript application/json application/xml font/truetype font/woff2 image/svg+xml;

    root /var/www2/iwantit/current/public;
    index index.php index.html;

    client_max_body_size 5G;

    # =========================================================================
    # Archivos sensibles — bloqueo
    # =========================================================================
    location ~ (^|/)\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* \.(bak|sql|ini|log|sh|inc|swp|dist)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* composer\.(json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~* (package\.json|package-lock\.json|webpack\.config\.js|vite\.config\.js)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    location ~ /\.(env|htaccess|git) { deny all; }
    location ~ ^/(storage|bootstrap/cache)/ { deny all; }

    # =========================================================================
    # robots.txt — público, sin autenticación
    # =========================================================================
    location = /robots.txt {
        access_log off;
        log_not_found off;
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 'User-agent: *
Disallow: /';
    }
    location = /favicon.ico { access_log off; log_not_found off; }

    # =========================================================================
    # Login — rate limiting
    # =========================================================================
    location = /login {
        limit_req zone=login burst=3 nodelay;
        try_files $uri $uri/ @laravel;
    }

    # =========================================================================
    # PLAYERS
    # =========================================================================
    location = /players { return 301 $scheme://$http_host/players/; }
    location ^~ /players/ {
        alias /var/www2/iwantit/current/players/;
        index index.html;
        try_files $uri $uri/ /players/index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # BBM
    # =========================================================================
    location ^~ /bbm/ {
        alias /var/www2/iwantit/current/bbm/;
        index index.html;
        try_files $uri $uri/ /bbm/index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # TEST
    # =========================================================================
    location = /test { return 301 $scheme://$http_host/test/; }
    location ^~ /test/ {
        alias /var/www2/iwantit/current/test/;
        index index.html;
        try_files $uri $uri/ /test/index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # =========================================================================
    # UPLOADS
    # =========================================================================
    location /uploads/ {
        alias /var/www/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        location ~* /uploads/.*\.(php|pl|py|cgi|asp|jsp)$ { deny all; }
    }

    # =========================================================================
    # Laravel — fallback vía named location (@laravel)
    # =========================================================================
    location / {
        try_files $uri $uri/ @laravel;
    }
    location @laravel {
        rewrite ^ /index.php last;
    }

    # =========================================================================
    # PHP Handling (PHP 8.4) — rate limiting en peticiones dinámicas
    # =========================================================================
    location ~ \.php$ {
        limit_req zone=general burst=10 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param PHP_VALUE "upload_max_filesize=5G \n post_max_size=5G \n memory_limit = 5G \n max_execution_time = 500";
        fastcgi_read_timeout 600;
    }
}

# =============================================================================
# HTTP → HTTPS
# =============================================================================
server {
    listen 80;
    server_name uat.i-want-it.es demo.i-want-it.es;
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www2/iwantit/current/public;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
