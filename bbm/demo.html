<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWI Video.js Player 1.0.0 - Full View Port</title>

    <link href="iwi-player.css" rel="stylesheet" />
    <script src="iwi-player.js" defer></script>

    <style>
        body {
            font-family: sans-serif;
            background-color: #000;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            /* Better mobile support (dynamic navigation bar) */
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
    </style>
</head>

<body>

    <div class="video-container">
        <video id="my-video" class="video-js iwi-player vjs-default-skin" controls preload="auto" playsinline
            webkit-playsinline poster="/players/img/cover.jpeg" data-iwi-vid="25" data-iwi-key="">

            <source src="https://uat.i-want-it.es/uploads/1779869118.mp4" type="video/mp4" />

            <track kind="captions"
                src="data:text/vtt;charset=utf-8,WEBVTT%0A%0A00%3A00%3A01.000%20--%3E%2000%3A00%3A05.000%0ATest%20subtitles."
                srclang="es" label="English" default>
        </video>
    </div>

</body>

</html>
