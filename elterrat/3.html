<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IWI Video.js Player 1.0.0 - CSS Grid 3x3 (20% | 60% | 20%)</title>

    <link href="iwi-player.css" rel="stylesheet" />
    <script src="iwi-player.js" defer></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;

            width: 100vw;
            height: 100vh;

            gap: 10px;
        }

        .cell {
            background-color: #333;
            border: 2px dashed #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #777;
        }

        .cell-video {
            min-width: 0;
            min-height: 0;
            position: relative;
            background: #000;
            min-width: 360px;
            min-height: 200px;
        }
    </style>
</head>

<body>

    <div class="grid-layout">
        <div class="cell">1</div>
        <div class="cell">2</div>
        <div class="cell">3</div>

        <div class="cell">4</div>

        <div class="cell-video">
            <video id="my-video" class="video-js iwi-player vjs-default-skin" controls preload="auto" playsinline
                webkit-playsinline poster="/bbm/img/cover.jpeg" data-iwi-vid="33"
                data-iwi-key="718f4d26adece8d770044542bcf0c89bfba8e150">
                <source src="https://uat.i-want-it.es/uploads/1780477225.mp4" type="video/mp4" />
                <track kind="captions"
                    src="data:text/vtt;charset=utf-8,WEBVTT%0A%0A00%3A00%3A01.000%20--%3E%2000%3A00%3A05.000%0AGrid%20Mode%20Active.%0A"
                    srclang="es" label="English" default>
            </video>
        </div>

        <div class="cell">5</div>
        <div class="cell">6</div>

        <div class="cell">7</div>
        <div class="cell">8</div>
        <div class="cell">9</div>
    </div>

</body>

</html>
